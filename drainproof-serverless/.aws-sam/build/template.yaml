AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'DrainProof - Smart Community Drainage Monitoring & Resolution Verification
  System AWS Serverless Application Model (SAM) Specification

  '
Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.12
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME:
          Ref: DrainReportsTable
        BUCKET_NAME:
          Ref: EvidenceBucket
Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: drainproof-evidence-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - GET
          - PUT
          - HEAD
          AllowedOrigins:
          - '*'
          MaxAge: 3600
  DrainReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DrainReports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: report_id
        AttributeType: S
      - AttributeName: status
        AttributeType: S
      - AttributeName: created_at
        AttributeType: S
      KeySchema:
      - AttributeName: report_id
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: StatusIndex
        KeySchema:
        - AttributeName: status
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  DrainProofApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: DrainProofHttpApi
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowHeaders:
        - '*'
        AllowMethods:
        - '*'
        MaxAge: 600
  CreateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateReportFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: DrainReportsTable
      Events:
        CreateReport:
          Type: HttpApi
          Properties:
            Path: /reports
            Method: post
            ApiId:
              Ref: DrainProofApi
    Metadata:
      SamResourceId: CreateReportFunction
  GenerateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GenerateUploadUrlFunction
      Handler: app.lambda_handler
      Policies:
      - S3WritePolicy:
          BucketName:
            Fn::Sub: drainproof-evidence-${AWS::AccountId}-${AWS::Region}
      - DynamoDBReadPolicy:
          TableName:
            Ref: DrainReportsTable
      Events:
        GenerateUploadUrl:
          Type: HttpApi
          Properties:
            Path: /reports/{id}/upload-url
            Method: post
            ApiId:
              Ref: DrainProofApi
    Metadata:
      SamResourceId: GenerateUploadUrlFunction
  SubmitReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SubmitReportFunction
      Handler: app.lambda_handler
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: DrainProofStateMachine
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: DrainReportsTable
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: drainproof-evidence-${AWS::AccountId}-${AWS::Region}
      - StepFunctionsExecutionPolicy:
          StateMachineName:
            Fn::GetAtt:
            - DrainProofStateMachine
            - Name
      Events:
        SubmitReport:
          Type: HttpApi
          Properties:
            Path: /reports/{id}/submit
            Method: post
            ApiId:
              Ref: DrainProofApi
    Metadata:
      SamResourceId: SubmitReportFunction
  GetReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetReportFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: DrainReportsTable
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: drainproof-evidence-${AWS::AccountId}-${AWS::Region}
      Events:
        GetReportById:
          Type: HttpApi
          Properties:
            Path: /reports/{id}
            Method: get
            ApiId:
              Ref: DrainProofApi
        ListReports:
          Type: HttpApi
          Properties:
            Path: /reports
            Method: get
            ApiId:
              Ref: DrainProofApi
    Metadata:
      SamResourceId: GetReportFunction
  UpdateStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: UpdateStatusFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: DrainReportsTable
      Events:
        UpdateStatus:
          Type: HttpApi
          Properties:
            Path: /reports/{id}/status
            Method: patch
            ApiId:
              Ref: DrainProofApi
    Metadata:
      SamResourceId: UpdateStatusFunction
  SubmitResolutionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SubmitResolutionFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: DrainReportsTable
      - S3WritePolicy:
          BucketName:
            Fn::Sub: drainproof-evidence-${AWS::AccountId}-${AWS::Region}
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: drainproof-evidence-${AWS::AccountId}-${AWS::Region}
      Events:
        SubmitResolution:
          Type: HttpApi
          Properties:
            Path: /reports/{id}/resolution
            Method: post
            ApiId:
              Ref: DrainProofApi
        VerifyResolution:
          Type: HttpApi
          Properties:
            Path: /reports/{id}/verify-resolution
            Method: post
            ApiId:
              Ref: DrainProofApi
    Metadata:
      SamResourceId: SubmitResolutionFunction
  ValidateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ValidateReportFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: DrainReportsTable
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: drainproof-evidence-${AWS::AccountId}-${AWS::Region}
    Metadata:
      SamResourceId: ValidateReportFunction
  CalculatePriorityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CalculatePriorityFunction
      Handler: app.lambda_handler
    Metadata:
      SamResourceId: CalculatePriorityFunction
  DetectDuplicatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DetectDuplicatesFunction
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: DrainReportsTable
    Metadata:
      SamResourceId: DetectDuplicatesFunction
  DrainProofStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: ..\..\step-functions\report_workflow.asl.json
      DefinitionSubstitutions:
        ValidateReportFunctionArn:
          Fn::GetAtt:
          - ValidateReportFunction
          - Arn
        CalculatePriorityFunctionArn:
          Fn::GetAtt:
          - CalculatePriorityFunction
          - Arn
        DetectDuplicatesFunctionArn:
          Fn::GetAtt:
          - DetectDuplicatesFunction
          - Arn
        UpdateStatusFunctionArn:
          Fn::GetAtt:
          - UpdateStatusFunction
          - Arn
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ValidateReportFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: CalculatePriorityFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: DetectDuplicatesFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: UpdateStatusFunction
Outputs:
  HttpApiUrl:
    Description: HTTP API Gateway endpoint URL
    Value:
      Fn::Sub: https://${DrainProofApi}.execute-api.${AWS::Region}.amazonaws.com
  EvidenceBucketName:
    Description: S3 Bucket Name for Evidence Storage
    Value:
      Ref: EvidenceBucket
  DynamoDBTableName:
    Description: DynamoDB Table Name
    Value:
      Ref: DrainReportsTable
  StateMachineArn:
    Description: Step Functions State Machine ARN
    Value:
      Ref: DrainProofStateMachine
